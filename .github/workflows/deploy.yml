name: Deploy to Hostinger

# Auto-deploy ONLY when code is pushed to the `live` branch.
# Manual runs are also limited to the `live` branch via the job `if` below.
on:
  push:
    branches:
      - live
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-live
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    if: github.ref == 'refs/heads/live'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2

      - name: Copy env
        run: cp .env.example .env

      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist

      - name: Generate APP_KEY
        run: php artisan key:generate

      - name: Prepare SQLite
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/live'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Copy env
        run: cp .env.example .env

      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist --no-dev

      - name: Generate APP_KEY
        run: php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm deps and build assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "${SSH_KEY:-}" ]; then
            echo "HOSTINGER_SSH_KEY secret is empty"
            exit 1
          fi

          # Write private key safely (preserve newlines, strip Windows CR)
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "HOSTINGER_SSH_KEY is not a valid OpenSSH private key"
            echo "Paste the full private key including BEGIN/END lines into the GitHub secret"
            exit 1
          fi

          for i in 1 2 3 4 5; do
            if ssh-keyscan -p "${PORT}" -T 20 -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan attempt ${i} failed, retrying..."
            sleep $((i * 5))
          done

          echo "Testing SSH auth as ${USER}@${HOST}:${PORT} ..."
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key \
              -p "${PORT}" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              "${USER}@${HOST}" "echo SSH_OK"; then
              exit 0
            fi
            echo "SSH attempt ${i}/5 failed, waiting before retry..."
            sleep $((i * 8))
          done

          echo "SSH connection timed out from GitHub runner."
          echo "Check Hostinger IP Access / firewall allows external SSH (port ${PORT})."
          exit 1

      - name: Rsync application to Hostinger
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          PATH_REMOTE: ${{ secrets.HOSTINGER_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='tests/' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/app/public/*' \
            --exclude='database/*.sqlite' \
            -e "ssh -i ~/.ssh/deploy_key -p ${PORT} -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            ./ "${USER}@${HOST}:${PATH_REMOTE}/"

      - name: Remote Composer, migrate, and optimize
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.HOSTINGER_PATH }}"
            PHP_BIN="/opt/alt/php84/usr/bin/php"
            cd "$APP_DIR"

            if command -v composer >/dev/null 2>&1; then
              COMPOSER_BIN="$(command -v composer)"
            elif [ -f "$HOME/composer.phar" ]; then
              COMPOSER_BIN="$HOME/composer.phar"
            elif [ -f /usr/local/bin/composer ]; then
              COMPOSER_BIN="/usr/local/bin/composer"
            else
              echo "Composer not found on server"
              exit 1
            fi

            "$PHP_BIN" "$COMPOSER_BIN" install --no-dev --optimize-autoloader --no-interaction

            mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache
            chmod -R ug+rwx storage bootstrap/cache

            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan storage:link || true
            "$PHP_BIN" artisan optimize:clear
            "$PHP_BIN" artisan config:cache
            "$PHP_BIN" artisan route:cache
            "$PHP_BIN" artisan view:cache

            echo "Deploy finished successfully"
